project:
  type: website
  output-dir: _site
  resources:
    - assets/
  preview:
    port: 4200
    browser: true

# Cache computational outputs (R / Python) in _freeze/ so that rendering and
# publishing do not re-execute every page. Delete a page's _freeze entry (or
# edit the page) to force re-execution.
execute:
  freeze: auto

lang: en

website:
  title: "Guillaume Guex"
  # Public address of the site (used for social cards and the sitemap).
  # Replace it with your own domain once you have one.
  site-url: https://gguex.github.io/ggsite/
  favicon: assets/favicon.png
  # Preview card (image + description) shown when a link is shared on
  # LinkedIn, Slack, etc. Pages without an `image` fall back to this one.
  image: assets/profile.jpg
  open-graph: true
  twitter-card: true
  # "View source" link to the .qmd on GitHub. Enabled here, then switched off
  # with `repo-actions: false` everywhere except under visualizations/.
  repo-url: https://github.com/gguex/ggsite
  repo-subdir: frontend
  repo-actions: [source]
  navbar:
    left:
      - text: "About Me"
        href: index.qmd
      - text: "Teaching"
        href: teaching/index.qmd
      - text: "Visualizations"
        href: visualizations/index.qmd
  page-footer:
    left: "© 2026 Guillaume Guex"
    center: "Built with [Quarto](https://quarto.org)"
    right:
      - icon: envelope
        href: mailto:guillaume.guex@gmail.com
        aria-label: Email
      - icon: github
        href: https://github.com/gguex
        aria-label: GitHub
      - icon: person-badge
        href: https://orcid.org/0000-0003-1001-9525
        aria-label: ORCID

format:
  html:
    theme:
      - flatly
      - assets/styles.scss
    from: markdown+autolink_bare_uris
    title-block-banner: true
    toc: true
